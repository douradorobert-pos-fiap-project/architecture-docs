name: oficina-fase4-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: oficina
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports: ["5432:5432"]

  dynamodb-local:
    image: amazon/dynamodb-local:2.6.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8000:8000"]

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.15
    ports: ["9324:9324", "9325:9325"]

  mercado-pago-fake:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../bdd/fakes:/app:ro
    command: ["sh", "-c", "pip install --no-cache-dir fastapi==0.115.14 uvicorn==0.34.3 && uvicorn mercado_pago:app --host 0.0.0.0 --port 8080"]
    ports: ["8089:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 20
